    <script type="module">
        import { createApp, reactive } from "./vue.esm-browser.js"
        createApp({
            setup() {
                const web = reactive(
                    {
                        arr:[1,2,3,5],
                        title: "配置平台",
                        url: "peizhi.com",
                        user:50,
                        show:true,
                        Image:"./微信图片_20241124004726.png"
                    }
                )

                const edit = () => {
                    web.Image = "超级配置平台"
                }
                
                const show = () => {
                    web.show = !web.show
                }

                return {
                    msg: "success",
                    web,
                    edit,
                    show
                }
            }
        }).mount("#app")
    </script>
