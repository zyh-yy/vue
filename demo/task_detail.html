<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>任务详情页</title>
    <link rel="stylesheet" href="scene.css">
    <style>
        .scrollable-list {
            max-height: 200px;
            overflow-y: auto;
            width: 100%;
            border-collapse: collapse;
        }

        .scrollable-list th,
        .scrollable-list td {
            padding: 8px;
            border: 1px solid #ddd;
        }

        .scrollable-list tr {
            cursor: pointer;
        }

        .scrollable-list tr.active {
            background-color: blue;
            color: white;
        }

        /* 弹窗样式 */
        .modal {
            display: none;
            /* 默认隐藏 */
            position: fixed;
            z-index: 1;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            overflow: auto;
            background-color: rgba(0, 0, 0, 0.4);
        }

        .modal-content {
            background-color: #fefefe;
            margin: 15% auto;
            padding: 20px;
            border: 1px solid #888;
            width: 80%;
            max-width: 400px;
        }

        .close {
            color: #aaa;
            float: right;
            font-size: 28px;
            font-weight: bold;
        }

        .close:hover,
        .close:focus {
            color: black;
            text-decoration: none;
            cursor: pointer;
        }

        .field-select {
            margin-bottom: 10px;
        }

        .result-message {
            margin-top: 10px;
            font-weight: bold;
        }
    </style>
</head>

<body>
    <div id="app">
        <div class="username-display">{{ username }}</div>
        <div class="back-button">
            <button @click="goBack">返回</button>
        </div>
        <div class="details-container">
            <div class="left-column">
                <h3>已配置字段列表</h3>
                <table class="scrollable-list" @click="handleRowClick">
                    <thead>
                        <tr>
                            <th>字段名称</th>
                            <th>描述</th>
                            <th>类型</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr v-for="field in fields" :key="field.field_id" :data-field-id="field.field_id">
                            <td><strong>{{ field.field_name }}</strong></td>
                            <td>{{ field.description }}</td>
                            <td>{{ field.field_type }}</td>
                        </tr>
                    </tbody>
                </table>
                <div>
                    <button @click="openFieldModal('input')">增加依赖字段</button>
                    <button @click="openFieldModal('output')">增加产出字段</button>
                </div>
            </div>
            <div class="right-column">
                <h3>已配置输出字段列表</h3>
                <table class="scrollable-list" @click="handleRowClick">
                    <thead>
                        <tr>
                            <th>字段名称</th>
                            <th>描述</th>
                            <th>类型</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr v-for="field in outputFields" :key="field.field_id" :data-field-id="field.field_id">
                            <td><strong>{{ field.field_name }}</strong></td>
                            <td>{{ field.description }}</td>
                            <td>{{ field.field_type }}</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>

        <!-- 弹窗 -->
        <div id="fieldModal" class="modal">
            <div class="modal-content">
                <span class="close" @click="closeFieldModal">&times;</span>
                <h3>选择字段</h3>
                <select class="field-select" v-model="selectedModalFieldId">
                    <option disabled value="">请选择一个字段</option>
                    <option v-for="field in allFields" :key="field.field_id" :value="field.field_id">
                        {{ field.field_name }}
                    </option>
                </select>
                <button @click="addSelectedField">确认添加</button>
                <div class="result-message" v-if="resultMessage">{{ resultMessage }}</div>
            </div>
        </div>
    </div>

    <script type="module">
        import { createApp, ref, onMounted } from "./vue.esm-browser.js";

        createApp({
            setup() {
                const fields = ref([]);
                const outputFields = ref([]); // 新增 outputFields
                const allFields = ref([]);
                const username = ref('');
                const selectedFieldId = ref(null);
                const selectedModalFieldId = ref(null);
                const selectedField = ref(null);
                const resultMessage = ref('');
                const taskId = ref(null); // 假设任务ID为1，可以根据实际情况修改
                const fieldType = ref(null); // 用于存储字段类型（依赖或产出）

                const goBack = () => {
                    window.location.href = 'scene.html'; // 假设返回任务列表页
                };

                const fetchFields = async () => {
                    try {
                        const response = await fetch('http://127.0.0.1:8080/api/get_fields', {
                            method: 'GET',
                            headers: {
                                'Content-Type': 'application/json'
                            }
                        });

                        if (!response.ok) {
                            throw new Error('获取字段信息失败');
                        }

                        const data = await response.json();
                        allFields.value = data; // 将所有字段存储在 allFields 中

                    } catch (err) {
                        console.error('获取字段信息失败:', err);
                    }
                };

                const viewTaskDetails = async (taskId) => {
                    try {
                        const response = await fetch(`http://127.0.0.1:8080/api/get_task_details/${taskId}`, {
                            method: 'GET',
                            headers: {
                                'Content-Type': 'application/json'
                            }
                        });

                        if (!response.ok) {
                            throw new Error('获取任务详情失败');
                        }

                        const data = await response.json();
                        fields.value = data.input_fields; // 假设返回的数据包含 fields 属性
                        outputFields.value = data.output_fields; // 新增 output_fields
                    } catch (err) {
                        console.error('获取任务详情失败:', err);
                    }
                };

                const handleRowClick = (event) => {
                    const target = event.target.closest('tr');
                    if (target) {
                        const fieldId = target.getAttribute('data-field-id');
                        console.log('Selected Field ID:', fieldId);
                        selectedFieldId.value = fieldId;
                        selectedField.value = allFields.value.find(f => f.field_id === fieldId);
                    }
                };

                const openFieldModal = (type) => {
                    fieldType.value = type; // 设置字段类型（依赖或产出）
                    document.getElementById('fieldModal').style.display = 'block';
                };

                const closeFieldModal = () => {
                    document.getElementById('fieldModal').style.display = 'none';
                    resultMessage.value = ''; // 清空结果消息
                };

                const addSelectedField = async () => {
                    if (selectedModalFieldId.value) {
                        const field = allFields.value.find(f => f.field_id === selectedModalFieldId.value);
                        if (field) {
                            try {
                                const response = await fetch('http://127.0.0.1:8080/api/add_field_to_task', {
                                    method: 'POST',
                                    headers: {
                                        'Content-Type': 'application/json'
                                    },
                                    body: JSON.stringify({
                                        field_id: selectedModalFieldId.value,
                                        task_id: taskId.value,
                                        relation: fieldType.value // 确保 field_type 为数字
                                    })
                                });

                                if (!response.ok) {
                                    throw new Error('添加字段到任务失败');
                                }

                                const data = await response.json();
                                // fields.value.push(field); // 更新 fields 列表
                                viewTaskDetails(taskId.value);
                                selectedField.value = field;
                                resultMessage.value = '字段添加成功';
                                closeFieldModal();

                            } catch (err) {
                                viewTaskDetails(taskId.value);
                                console.error('添加字段到任务失败:', err);
                                resultMessage.value = '添加字段到任务失败';
                            }
                        } else {
                            resultMessage.value = '字段未找到';
                        }
                    } else {
                        resultMessage.value = '请选择一个字段';
                    }
                };

                onMounted(() => {
                    console.log('Component mounted');

                    // 从 URL 参数中读取 taskId
                    const urlParams = new URLSearchParams(window.location.search);
                    const taskIdFromUrl = urlParams.get('taskId');
                    console.log('taskIdFromUrl:', taskIdFromUrl);
                    if (taskIdFromUrl) {
                        taskId.value = parseInt(taskIdFromUrl, 10); // 将 taskId 转换为数字
                    } else {
                        console.error('任务ID未提供');
                        resultMessage.value = '任务ID未提供，请检查URL参数';
                        return; // 如果没有 taskId，停止后续逻辑
                    }

                    // 使用读取的 taskId 获取任务详情
                    viewTaskDetails(taskId.value);

                    // 获取所有字段
                    fetchFields();

                    username.value = localStorage.getItem('username') || '未登录';
                });

                return {
                    fields,
                    outputFields, // 新增 outputFields
                    allFields,
                    username,
                    goBack,
                    selectedFieldId,
                    selectedModalFieldId,
                    selectedField,
                    resultMessage,
                    taskId,
                    fieldType,
                    handleRowClick,
                    openFieldModal,
                    closeFieldModal,
                    addSelectedField
                };
            }
        }).mount("#app");
    </script>
</body>

</html>
